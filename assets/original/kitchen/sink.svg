<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 254 118" width="254" height="118">
  <!-- Bayangan Tebal Wastafel Bawah -->
  <rect x="4" y="10" width="246" height="106" rx="16" fill="#99c6d4"/>
  <!-- Bibir Luar Wastafel Putih Bersih Mengkilap -->
  <rect x="4" y="4" width="246" height="106" rx="16" fill="#ffffff" stroke="#2b3a4a" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Cekungan Dalam Wastafel Mint Pastel Bersih -->
  <rect x="16" y="16" width="222" height="82" rx="12" fill="#52b5bc" stroke="#2b3a4a" stroke-width="3"/>
  <rect x="20" y="20" width="214" height="74" rx="10" fill="#78d1d8"/>
  
  <!-- Kilau Cahaya Air Bersih -->
  <path d="M 28 26 L 216 26" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 28 33 L 90 33" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Lubang Pembuangan Air (Drain) -->
  <ellipse cx="127" cy="57" rx="18" ry="12" fill="#428e94" stroke="#2b3a4a" stroke-width="3"/>
  <ellipse cx="127" cy="57" rx="11" ry="7" fill="#205156"/>
  <!-- Lubang Saringan -->
  <circle cx="127" cy="57" r="2.5" fill="#14363a"/>
  <circle cx="121" cy="57" r="1.5" fill="#14363a"/>
  <circle cx="133" cy="57" r="1.5" fill="#14363a"/>
</svg>

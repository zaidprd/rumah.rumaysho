<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <!-- Bayangan Tikar Menempel di Lantai (2.5D Thin Floor Shadow) -->
  <polygon points="62,28 338,28 382,128 18,128" fill="#2b3a4a" opacity="0.12"/>
  <ellipse cx="200" cy="132" rx="180" ry="8" fill="#2b3a4a" opacity="0.1"/>

  <!-- Rumbai Benang Tepi Tikar Sisi Kiri (Fringe) -->
  <g stroke="#ffd175" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="64" y1="32" x2="52" y2="33"/>
    <line x1="58" y1="46" x2="45" y2="48"/>
    <line x1="52" y1="60" x2="38" y2="63"/>
    <line x1="46" y1="74" x2="31" y2="78"/>
    <line x1="40" y1="88" x2="24" y2="93"/>
    <line x1="34" y1="102" x2="17" y2="108"/>
    <line x1="28" y1="116" x2="10" y2="123"/>
  </g>

  <!-- Rumbai Benang Tepi Tikar Sisi Kanan (Fringe) -->
  <g stroke="#ffd175" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="336" y1="32" x2="348" y2="33"/>
    <line x1="342" y1="46" x2="355" y2="48"/>
    <line x1="348" y1="60" x2="362" y2="63"/>
    <line x1="354" y1="74" x2="369" y2="78"/>
    <line x1="360" y1="88" x2="376" y2="93"/>
    <line x1="366" y1="102" x2="383" y2="108"/>
    <line x1="372" y1="116" x2="390" y2="123"/>
  </g>

  <!-- Bidang Tikar Utama (Perspektif Rebah di Lantai) -->
  <polygon points="65,30 335,30 375,125 25,125" 
           fill="#fff6eb" stroke="#2b3a4a" stroke-width="4" stroke-linejoin="round"/>

  <!-- Lis Pinggiran Kain Tikar (Border Pink Stroberi Ceria) -->
  <!-- Lis Belakang -->
  <polygon points="65,30 335,30 330,40 70,40" fill="#ff70ad"/>
  <!-- Lis Depan (Tebal di Bagian Depan) -->
  <polygon points="25,125 375,125 370,113 30,113" fill="#ff70ad"/>
  <line x1="25" y1="125" x2="375" y2="125" stroke="#e04d80" stroke-width="3"/>
  <!-- Garis Jahitan Putih pada Lis Pinggir -->
  <line x1="72" y1="35" x2="328" y2="35" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="33" y1="119" x2="367" y2="119" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- Tekstur Anyaman Tikar (Woven Lattice Grid Pattern) -->
  <!-- Garis-Garis Anyaman Horisontal -->
  <g stroke="#f5d5b0" stroke-width="2" opacity="0.85">
    <line x1="68" y1="47" x2="332" y2="47"/>
    <line x1="63" y1="56" x2="337" y2="56"/>
    <line x1="57" y1="66" x2="343" y2="66"/>
    <line x1="51" y1="77" x2="349" y2="77"/>
    <line x1="44" y1="89" x2="356" y2="89"/>
    <line x1="37" y1="101" x2="363" y2="101"/>
  </g>

  <!-- Garis Anyaman Diagonal Perspektif (Salur Anyaman Halus) -->
  <g stroke="#ffc0d3" stroke-width="2" opacity="0.75">
    <line x1="100" y1="40" x2="70" y2="113"/>
    <line x1="145" y1="40" x2="125" y2="113"/>
    <line x1="190" y1="40" x2="180" y2="113"/>
    <line x1="235" y1="40" x2="235" y2="113"/>
    <line x1="280" y1="40" x2="290" y2="113"/>
    <line x1="310" y1="40" x2="335" y2="113"/>
  </g>

  <!-- Motif Tengah Tikar Tradisional/Modern: Belah Ketupat Pastel Pink -->
  <g fill="#ffe0eb" stroke="#ff70ad" stroke-width="2" stroke-linejoin="round">
    <!-- Motif Belah Ketupat Kiri -->
    <polygon points="135,76 150,60 165,76 150,92"/>
    <circle cx="150" cy="76" r="3" fill="#ff70ad"/>

    <!-- Motif Belah Ketupat Tengah (Paling Besar) -->
    <polygon points="180,76 200,56 220,76 200,96"/>
    <circle cx="200" cy="76" r="4" fill="#ff70ad"/>
    <circle cx="200" cy="76" r="2" fill="#ffffff"/>

    <!-- Motif Belah Ketupat Kanan -->
    <polygon points="235,76 250,60 265,76 250,92"/>
    <circle cx="250" cy="76" r="3" fill="#ff70ad"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 160" width="110" height="160">
  <!-- Bayangan Kaki Kursi di Lantai (2.5D Shadow) -->
  <ellipse cx="55" cy="150" rx="42" ry="8" fill="#2b3a4a" opacity="0.18"/>

  <!-- Sandaran Kursi Belakang (Strawberry Pink Duolingo) -->
  <!-- Bayangan Sandaran -->
  <rect x="25" y="16" width="60" height="74" rx="10" fill="#e04d80"/>
  <rect x="25" y="10" width="60" height="74" rx="10" fill="#ff70ad" stroke="#2b3a4a" stroke-width="4"/>
  <!-- Lubang Sandaran Imut -->
  <rect x="35" y="24" width="40" height="20" rx="6" fill="#ffa8cd" stroke="#2b3a4a" stroke-width="2.5"/>
  <line x1="42" y1="56" x2="42" y2="76" stroke="#e04d80" stroke-width="4" stroke-linecap="round"/>
  <line x1="68" y1="56" x2="68" y2="76" stroke="#e04d80" stroke-width="4" stroke-linecap="round"/>

  <!-- Dua Kaki Kursi Belakang (Kayu Madu) -->
  <rect x="28" y="90" width="10" height="52" rx="3" fill="#d97706" stroke="#2b3a4a" stroke-width="3"/>
  <rect x="72" y="90" width="10" height="52" rx="3" fill="#d97706" stroke="#2b3a4a" stroke-width="3"/>

  <!-- Busa / Ketebalan Dudukan Depan (3D Depth) -->
  <path d="M 16 92 L 16 104 C 16 112, 94 112, 94 104 L 94 92 Z" fill="#d97706"/>
  <!-- Apron Kayu Bawah Dudukan -->
  <rect x="18" y="92" width="74" height="10" rx="3" fill="#ffa834" stroke="#2b3a4a" stroke-width="3"/>

  <!-- Permukaan Atas Dudukan Kursi (2.5D Top-Surface Miring Rebah) -->
  <ellipse cx="55" cy="88" rx="42" ry="18" fill="#ffa8cd"/>
  <ellipse cx="55" cy="85" rx="42" ry="18" fill="#ffeaf2" stroke="#2b3a4a" stroke-width="3.5"/>
  <ellipse cx="55" cy="85" rx="36" ry="14" fill="#ffffff" stroke="#ffb8cc" stroke-width="2"/>

  <!-- Dua Kaki Kursi Depan (Lebih Panjang & Terlihat Jelas di Depan) -->
  <rect x="20" y="98" width="12" height="52" rx="4" fill="#ffa834" stroke="#2b3a4a" stroke-width="3.5"/>
  <rect x="78" y="98" width="12" height="52" rx="4" fill="#ffa834" stroke="#2b3a4a" stroke-width="3.5"/>
  <!-- Sepatu Kaki Kursi Kayu Gelap -->
  <rect x="19" y="142" width="14" height="10" rx="3" fill="#8c5828" stroke="#2b3a4a" stroke-width="2.5"/>
  <rect x="77" y="142" width="14" height="10" rx="3" fill="#8c5828" stroke="#2b3a4a" stroke-width="2.5"/>
</svg>

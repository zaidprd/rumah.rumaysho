  <path d="M 56 26 C 72 26, 72 56, 56 56" fill="none" stroke="#ff599e" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Badan Cangkir Candy Pink Cerah -->
  <!-- Bayangan Bawah Tebal Khas Duolingo -->
  <rect x="16" y="26" width="44" height="44" rx="10" fill="#e84088"/>
  <!-- Badan Utama Pink Manis -->
  <rect x="16" y="20" width="44" height="44" rx="10" fill="#ff70ad" stroke="#2b3a4a" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Lis Bibir Cangkir Atas -->
  <rect x="14" y="17" width="48" height="9" rx="4.5" fill="#ffa3ca" stroke="#2b3a4a" stroke-width="3.5"/>
  <line x1="19" y1="20" x2="57" y2="20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Kilau Permukaan Imut -->
  <path d="M 22 28 L 22 52" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="28" cy="33" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="28" cy="42" r="2" fill="#ffffff" opacity="0.7"/>

  <!-- Hati / Aksen Manis di Tengah Cangkir -->
